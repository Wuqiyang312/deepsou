<div class="marquee"><span>★ 深搜留言本 —— 来都来了,签个名再走 ★ 留言只保存在你自己的浏览器中,站长看不到,但仪式感是真的 ★</span></div>

<main>
<div class="page-title">
  <h2>▍留言本</h2>
  <div class="sub">Guestbook · 留言存于您浏览器的 localStorage · 仅您本人可见</div>
</div>

<div class="page-body">
  <div class="panel">
    <h3>▍大家的留言</h3>
    <div class="gb-list" id="gbList" style="max-width:none;margin:0"></div>
  </div>

  <div class="gb-form panel">
    <h3>▍写点什么</h3>
    <div class="field"><label>您的昵称</label><input id="gbWho" maxlength="16" placeholder="例如:热心网友小王"></div>
    <div class="field"><label>留言内容</label><textarea id="gbTxt" rows="3" maxlength="200" placeholder="说点什么吧,站长会看"></textarea></div>
    <div class="status-line" id="gbStatus"></div>
    <div style="margin-top:10px"><button type="button" class="btn btn-primary" id="gbSubmit">提交留言</button></div>
  </div>
</div>
</main>
