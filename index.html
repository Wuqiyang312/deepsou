<!doctype html>

<title>深度搜索 DeepSou - 回到 1998</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%231b39c8' stroke-width='3'/%3E%3Cline x1='21' y1='21' x2='29' y2='29' stroke='%231b39c8' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
<!-- ===================== 2009 百度式首页 ===================== -->
<div class="home">
  <div class="home-logo">
    <h1>深度搜索</h1>
  </div>

  <!-- 搜索框上方蓝色 tab 行 -->
  <div class="home-tabs" id="homeTabs">
    <a href="#" data-tab="网页" class="cur">网页</a>
    <a href="#" data-tab="新闻">新闻</a>
    <a href="#" data-tab="贴吧">贴吧</a>
    <a href="#" data-tab="知道">知道</a>
    <a href="#" data-tab="MP3">MP3</a>
    <a href="#" data-tab="图片">图片</a>
    <a href="#" data-tab="视频">视频</a>
    <a href="#" data-tab="地图">地图</a>
    <a href="#" data-tab="百科">百科</a>
  </div>

  <!-- 大搜索框 -->
  <form class="home-form" id="homeForm" autocomplete="off">
    <input type="text" id="homeInput" placeholder="请输入关键词,例如:恐龙是怎么灭绝的" aria-label="搜索关键词">
    <button type="submit" class="go">深度搜索一下</button>
  </form>
  <div style="margin-top:10px"><button type="button" class="btn" id="btnLucky">手气不错</button></div>

  <!-- 搜索框下方功能链接行 -->
  <div class="home-links">
    <a href="#" class="js-sethome">把深度搜索设为首页</a>|
    <a href="#" class="js-fav">加入收藏夹</a>|
    <a href="dir.html">分类目录</a>|
    <a href="guestbook.html">留言本</a>|
    <a href="about.html">关于本站</a>|
    <a href="settings.html">API 设置</a>
  </div>
</div>
</main>

<!-- ===================== 页脚(2009 百度式版权行) ===================== -->
<footer>
  <div class="mono">©2026 DeepSou 深度搜索 · <a href="about.html">关于本站</a> · <a href="about.html#privacy">隐私说明</a> · <a href="#" class="js-theme">夜视模式</a></div>
  <div class="mono" id="ftDate"></div>
</footer>

<!-- ===================== 弹窗骨架 ===================== -->

    <div class="m-body" id="mBody"></div>
    <div class="m-foot" id="mFoot"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
